import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

/**
 * رقم الإصدار يُقرأ من `package.json` — مصدرٌ واحد لا ثلاثة.
 *
 * 🔴 لولاه لتفرّق الرقم في ثلاثة مواضع: `package.json`، و`versionName` هنا،
 * و`__APP_VERSION__` الذي يقارنه فحص التحديث. وأول انحرافٍ بينها يعني أن
 * التاجر إمّا لا يُشعَر بتحديثٍ صدر، أو يُشعَر بتحديثٍ هو مثبِّتُه أصلاً.
 *
 * و`versionCode` عددٌ صحيح يجب أن **يتزايد** مع كل إصدار (يرفض أندرويد تثبيت
 * نسخةٍ رقمها أقلّ). الاشتقاق `major*10000 + minor*100 + patch` يضمن التزايد
 * ويترك ٩٩ إصداراً فرعياً بين كل نسختين.
 */
def pkg = new JsonSlurper().parse(file('../../package.json'))
def appVersion = pkg.version
def parts = appVersion.tokenize('.').collect { it.replaceAll(/[^0-9].*/, '').toInteger() }
def appVersionCode = (parts[0] ?: 0) * 10000 + (parts[1] ?: 0) * 100 + (parts[2] ?: 0)

/**
 * إعدادات التوقيع — من ملفٍ **خارج git**.
 *
 * 🔴 كلمات مرور مفتاح التوقيع لا تُكتب في ملفٍ مُتتبَّع أبداً: من يملك المفتاح
 * وكلمته يستطيع إصدار تحديثٍ باسم تطبيقك يثق به كل من ثبّته.
 * والملف `android/keystore.properties` مُستبعَد في .gitignore.
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasKeystore = keystorePropsFile.exists()

android {
    namespace = "com.ratibshghlk.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ratibshghlk.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

/**
 * 🔴 فشلٌ صريح بدل ملفٍ لا يُثبَّت.
 *
 * `assembleRelease` بلا مفتاح توقيع يُنتج APK **غير موقّع**، وأندرويد يرفض
 * تثبيته برسالة «تعذّر تحليل الحزمة» — رسالةٌ لا تدلّ على السبب إطلاقاً.
 * فيرفع المزوّد ملفاً معطوباً إلى موقعه ولا يكتشف ذلك إلا من شكوى أول زبون.
 */
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.name in ['assembleRelease', 'bundleRelease'] }
    if (wantsRelease && !hasKeystore) {
        throw new GradleException(
            "\n\n  ✋ لا يمكن بناء نسخة الإصدار بلا مفتاح توقيع.\n" +
            "     الملف المطلوب: android/keystore.properties\n" +
            "     أنشئ المفتاح أولاً (مرّةً واحدة) ثم احتفظ بنسخةٍ منه خارج الجهاز —\n" +
            "     فقدانه يعني استحالة إصدار أي تحديث لهذا التطبيق إلى الأبد.\n" +
            "     التفاصيل في: android/KEYSTORE.md\n"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
